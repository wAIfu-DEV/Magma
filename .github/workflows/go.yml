name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.6
      - run: go test ./...
      - run: go vet ./...
      - name: Race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
